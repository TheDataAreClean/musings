name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      # prebuild (part of `npm run build`) converts uploads to WebP and
      # backfills dates/permalinks. `src/images` is a symlink to `../images`
      # (see CLAUDE.md), so writes made through that path land at the real
      # repo path `images/...`, outside `src/`. Stage the whole working tree
      # (not just `-- src/`) so no generated path — present or future — is
      # silently left unstaged, which would make `git pull --rebase` below
      # fail on "unstaged changes" and lose the push.
      - name: Commit generated content changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Chore: auto-convert images and backfill content [skip ci]"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
