site_name: Musings
logo_url: /favicon-512.png

backend:
  name: github
  repo: TheDataAreClean/musings
  branch: main
  base_url: https://sveltia-cms-auth.thedataareclean.workers.dev

media_folder: images/uploads
public_folder: /images/uploads

slug:
  encoding: ascii
  clean_accents: true

collections:

  - name: ideas
    label: Ideas
    label_singular: Idea
    folder: src/ideas
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { name: draft, label: Draft, widget: boolean, default: false, required: false, hint: "Tick before saving if not ready. Hidden from listings and feed; the link still works." }
      - { name: title, label: Title, widget: string, hint: "The post's headline." }
      - { name: description, label: Description, widget: text, required: false, hint: "One sentence. Shown under the title and in link previews." }
      - name: tags
        label: Tags
        widget: list
        required: false
        hint: "Extra tags, e.g. design, tech, personal. 'ideas' is automatic."
      - { name: body, label: Body, widget: markdown, hint: "Write the post here." }
      - { name: slug, label: Slug, widget: string, required: false, hint: "Optional. Blank uses the title. Lowercase, hyphens only." }
      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "YYYY-MM-DD", time_format: "HH:mm", hint: "Shown on the post and used to sort it." }
      - { name: version, label: Version, widget: number, value_type: int, min: 1, default: 1, required: false, hint: "Raise by 1 in the same save as your first edit to keep the old version." }
      - { name: versionNote, label: What changed, widget: string, required: false, hint: "One line on what's new in this version." }

  - name: notes
    label: Notes
    label_singular: Note
    folder: src/notes
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { name: draft, label: Draft, widget: boolean, default: false, required: false, hint: "Tick before saving if not ready. Hidden from listings and feed; the link still works." }
      - { name: title, label: Title, widget: string, hint: "The post's headline." }
      - { name: description, label: Description, widget: text, required: false, hint: "One sentence. Shown under the title and in link previews." }
      - name: tags
        label: Tags
        widget: list
        required: false
        hint: "Extra tags, e.g. personal, tech, create. 'notes' is automatic."
      - { name: body, label: Body, widget: markdown, hint: "Write the post here." }
      - { name: slug, label: Slug, widget: string, required: false, hint: "Optional. Blank uses the title. Lowercase, hyphens only." }
      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "YYYY-MM-DD", time_format: "HH:mm", hint: "Shown on the post and used to sort it." }
      - { name: version, label: Version, widget: number, value_type: int, min: 1, default: 1, required: false, hint: "Raise by 1 in the same save as your first edit to keep the old version." }
      - { name: versionNote, label: What changed, widget: string, required: false, hint: "One line on what's new in this version." }

  - name: snaps
    label: Snaps
    label_singular: Snap
    folder: src/snaps
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { name: draft, label: Draft, widget: boolean, default: false, required: false, hint: "Tick before saving if not ready. Hidden from listings and feed; the link still works." }
      - { name: title, label: Title, widget: string, hint: "The post's headline." }
      - { name: description, label: Description, widget: text, required: false, hint: "One line of context." }
      - name: tags
        label: Tags
        widget: list
        required: false
        hint: "Extra tags, e.g. luru, family, street. 'snaps' is automatic."
      - { name: body, label: Body, widget: markdown, hint: "Add the photo, then any caption." }
      - { name: slug, label: Slug, widget: string, required: false, hint: "Optional. Blank uses the title. Lowercase, hyphens only." }
      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "YYYY-MM-DD", time_format: "HH:mm", hint: "Shown on the post and used to sort it." }
      - { name: version, label: Version, widget: number, value_type: int, min: 1, default: 1, required: false, hint: "Raise by 1 in the same save as your first edit to keep the old version." }
      - { name: versionNote, label: What changed, widget: string, required: false, hint: "One line on what's new in this version." }
