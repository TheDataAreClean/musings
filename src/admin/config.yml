site_name: Musings
logo_url: /favicon-512.png

backend:
  name: github
  repo: TheDataAreClean/musings
  branch: main
  base_url: https://sveltia-cms-auth.thedataareclean.workers.dev

# Sveltia's image caption field would save a raw HTML figure. Captions here are
# the markdown image title, which the site turns into a figure itself.
field_defaults:
  richtext:
    captioned_images: false

media_folder: images/uploads
public_folder: /images/uploads

# Convert JPEG/PNG to WebP in the browser, before the upload. The save then
# commits a finished .webp, so the deploy bot has nothing to convert and
# doesn't push a follow-up commit to main (that commit raced the next CMS
# save: "The repository has been updated by someone else while saving").
# Sveltia 0.271+ converts HEIC here too, which browsers decode themselves
# (Safari, and Chrome on a Mac). There is no build-time conversion any more.
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 2400
          height: 2400

slug:
  encoding: ascii
  clean_accents: true

collections:

  - name: ideas
    label: Ideas
    label_singular: Idea
    folder: src/ideas
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields:
      - { field: date, label: Date, default_sort: desc }
      - { field: title, label: Title }
    fields:
      - { name: draft, label: Draft, widget: boolean, default: false, required: false, hint: "Tick before saving if not ready. Hidden from listings and feed; the link still works." }
      - { name: title, label: Title, widget: string, hint: "The post's headline." }
      - { name: description, label: Description, widget: text, required: false, hint: "One sentence. Shown under the title and in link previews." }
      - name: tags
        label: Tags
        widget: list
        required: false
        hint: "Extra tags, e.g. design, tech, personal. 'ideas' is automatic."
      - { name: body, label: Body, widget: markdown, hint: "Write the post here." }
      - { name: slug, label: Slug, widget: string, required: false, hint: "Optional. Blank uses the title. Lowercase, hyphens only." }
      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "YYYY-MM-DD", time_format: "HH:mm", hint: "Shown on the post and used to sort it." }
      - { name: version, label: Version, widget: number, value_type: int, min: 1, default: 1, required: false, hint: "Raise by 1 in the same save as your first edit to keep the old version." }
      - { name: versionNote, label: What changed, widget: string, required: false, hint: "One line on what's new in this version." }
      - { name: moveTo, label: Section, widget: select, options: [{ label: Ideas, value: ideas }, { label: Notes, value: notes }, { label: Snaps, value: snaps }], required: false, hint: "Leave as is, or pick another section and save to move this post there. The old link stops working. Don't change Version in the same save." }

  - name: notes
    label: Notes
    label_singular: Note
    folder: src/notes
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields:
      - { field: date, label: Date, default_sort: desc }
      - { field: title, label: Title }
    fields:
      - { name: draft, label: Draft, widget: boolean, default: false, required: false, hint: "Tick before saving if not ready. Hidden from listings and feed; the link still works." }
      - { name: title, label: Title, widget: string, hint: "The post's headline." }
      - { name: description, label: Description, widget: text, required: false, hint: "One sentence. Shown under the title and in link previews." }
      - name: tags
        label: Tags
        widget: list
        required: false
        hint: "Extra tags, e.g. personal, tech, create. 'notes' is automatic."
      - { name: body, label: Body, widget: markdown, hint: "Write the post here." }
      - { name: slug, label: Slug, widget: string, required: false, hint: "Optional. Blank uses the title. Lowercase, hyphens only." }
      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "YYYY-MM-DD", time_format: "HH:mm", hint: "Shown on the post and used to sort it." }
      - { name: version, label: Version, widget: number, value_type: int, min: 1, default: 1, required: false, hint: "Raise by 1 in the same save as your first edit to keep the old version." }
      - { name: versionNote, label: What changed, widget: string, required: false, hint: "One line on what's new in this version." }
      - { name: moveTo, label: Section, widget: select, options: [{ label: Ideas, value: ideas }, { label: Notes, value: notes }, { label: Snaps, value: snaps }], required: false, hint: "Leave as is, or pick another section and save to move this post there. The old link stops working. Don't change Version in the same save." }

  - name: snaps
    label: Snaps
    label_singular: Snap
    folder: src/snaps
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields:
      - { field: date, label: Date, default_sort: desc }
      - { field: title, label: Title }
    fields:
      - { name: draft, label: Draft, widget: boolean, default: false, required: false, hint: "Tick before saving if not ready. Hidden from listings and feed; the link still works." }
      - { name: title, label: Title, widget: string, hint: "The post's headline." }
      - { name: description, label: Description, widget: text, required: false, hint: "One line of context." }
      - name: tags
        label: Tags
        widget: list
        required: false
        hint: "Extra tags, e.g. luru, family, street. 'snaps' is automatic."
      - { name: body, label: Body, widget: markdown, hint: "Add the photo, then any caption." }
      - { name: slug, label: Slug, widget: string, required: false, hint: "Optional. Blank uses the title. Lowercase, hyphens only." }
      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "YYYY-MM-DD", time_format: "HH:mm", hint: "Shown on the post and used to sort it." }
      - { name: version, label: Version, widget: number, value_type: int, min: 1, default: 1, required: false, hint: "Raise by 1 in the same save as your first edit to keep the old version." }
      - { name: versionNote, label: What changed, widget: string, required: false, hint: "One line on what's new in this version." }
      - { name: moveTo, label: Section, widget: select, options: [{ label: Ideas, value: ideas }, { label: Notes, value: notes }, { label: Snaps, value: snaps }], required: false, hint: "Leave as is, or pick another section and save to move this post there. The old link stops working. Don't change Version in the same save." }
